start_charging:
  name: Start charging
  description: >-
    Start charging. Select either charger device or
    specify the charge_point_id directly
  fields:
    charge_point_id:
      name: Charger
      description: >-
        The charger. Pick one from the list, or pass the numeric Monta
        charge point id.
      example: 12345
      required: true
      selector:
        device:
          filter:
            integration: monta

stop_charging:
  name: Stop charging
  description: >-
    Stop the active charging. Select either charger device
    or specify the charge_point_id directly
  fields:
    charge_point_id:
      name: Charger
      description: >-
        The charger. Pick one from the list, or pass the numeric Monta
        charge point id.
      example: 12345
      required: true
      selector:
        device:
          filter:
            integration: monta
